<title>Hi! @sayabangucok</title>

<style>
:root{--bg:#0a0a0a;--ink:#f4ecd8;--glow:#ffd98a;--muted:#9a9a9a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;overflow-x:hidden;min-height:100vh}
header{text-align:center;padding:32px 20px 8px;position:relative;z-index:2}
h1{margin:0;color:#fff;font-family:"Archivo Black",Impact,"Arial Black",sans-serif;font-weight:400;font-size:clamp(26px,6.4vw,72px);line-height:1.05;letter-spacing:.02em;text-transform:uppercase;overflow-wrap:anywhere}
header p{max-width:720px;margin:16px auto 0;color:#f2f2f2;font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500;font-size:clamp(12.5px,1.9vw,16px);line-height:1.55}
.stage{position:relative;width:min(1000px,100%);margin:-10px auto 0}
.stage img{display:block;width:100%;height:auto;-webkit-mask-image:radial-gradient(ellipse 72% 74% at 50% 50%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 72% 74% at 50% 50%,#000 62%,transparent 100%)}
.fx{position:absolute;pointer-events:none;border-radius:50%;opacity:0;transform:translate(-50%,-50%)}

.stage img.up{position:absolute;left:0;top:0;opacity:0;transition:opacity .6s ease}.stage img.up.on{opacity:1}
#hand{left:24%;top:42%;width:34%;aspect-ratio:1;background:radial-gradient(circle,rgba(255,200,100,.5),transparent 65%);mix-blend-mode:screen}
#halo{left:23.6%;top:37.7%;width:9%;aspect-ratio:1;background:radial-gradient(circle,#fff 0,#ffd98a 30%,rgba(255,217,138,0) 70%)}
#tip{position:absolute;left:23.6%;top:37.7%;width:1px;height:1px}
.bubble{position:absolute;left:36.5%;top:74%;width:27%;min-width:200px;min-height:64px;display:flex;flex-direction:column;justify-content:center;color:#2a2438;padding:6px 38px}
.burst{position:absolute;left:-15.8%;top:-65.5%;width:131.6%;height:231%;overflow:visible;pointer-events:none;z-index:0;filter:drop-shadow(0 0 8px rgba(255,235,180,.75)) drop-shadow(0 0 22px rgba(255,217,138,.4))}
.sp{fill:#fff;fill-opacity:.8}.s0,.s1{animation:fl .5s steps(1) infinite}.s1{animation-delay:-.25s}
@keyframes fl{0%{opacity:.95}50%{opacity:0}}
.bubble input,.bubble small{position:relative;z-index:1}
.bubble input{width:100%;text-align:center;border:0;background:transparent;font:inherit;font-size:16px;color:#2a2438;outline:none}
.bubble input::placeholder{color:#8a8296;font-style:italic}
.bubble small{display:block;margin-top:2px;color:#8a8296;font-size:10px;text-align:center}
.orb{position:fixed;left:0;top:0;z-index:20;pointer-events:none;will-change:transform,opacity}
.orb .gl{position:absolute;inset:-70%;border-radius:50%;background:radial-gradient(circle,rgba(255,244,200,.95) 0,rgba(255,220,130,.7) 28%,rgba(255,190,80,.3) 48%,rgba(255,180,60,0) 70%);filter:blur(10px)}
.orb span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:14%;border-radius:50%;overflow-wrap:anywhere;font-size:15px;line-height:1.25;color:#3a2a08;background:radial-gradient(circle,#fffef6 0,#fff6d0 55%,rgba(255,236,170,.9) 78%,rgba(255,226,140,0) 100%)}
@media(max-width:640px){
.stage{aspect-ratio:.95}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%}
.bubble{left:20%;top:72%;width:60%;min-width:190px;padding:6px 30px}
#halo{left:12.8%;top:37.7%;width:20%}
#tip{left:12.8%;top:37.7%}
#hand{left:15%;top:42%;width:60%}
}
@media(prefers-reduced-motion:reduce){.s0,.s1{animation:none}}
#flood{position:fixed;inset:0;z-index:40;background:#fffbe8;opacity:0;pointer-events:none;transition:opacity 1.3s ease-in,background-color .9s}
#flood.on{opacity:1;pointer-events:auto}
#flood.dark{background:#000}
</style>

<div class="fx" id="hand"></div>
<div class="fx" id="halo"></div>
<div id="tip"></div>
</div>
<div id="flood" aria-hidden="true"></div>
<script>
(function(){
var stage=document.querySelector('.stage'),tip=document.getElementById('tip'),hand=document.getElementById('hand'),halo=document.getElementById('halo'),up=document.getElementById('photoUp'),aim=document.getElementById('photoAim'),flood=document.getElementById('flood');
var bubble=document.createElement('div');bubble.className='bubble';
bubble.innerHTML='<input id="msg" maxlength="40" autocomplete="off" placeholder="Tulis pesanmu di sini" aria-label="Pesan untuk dikirim sebagai cahaya">';
(function(){
  var NS='http://www.w3.org/2000/svg',cx=250,cy=120,rx=190,ry=52;
  var svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 500 240');svg.setAttribute('preserveAspectRatio','none');svg.setAttribute('class','burst');svg.setAttribute('aria-hidden','true');
  var h='<defs><filter id="bl" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="1.8"/></filter><filter id="bc" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="3"/></filter></defs><ellipse cx="250" cy="120" rx="188" ry="50" fill="#fffaf0" filter="url(#bc)"/>';
  for(var g=0;g<2;g++){
    var d='';
    for(var i=0;i<170;i++){
      var a=(i+Math.random()*.9)/170*Math.PI*2,c=Math.cos(a),s=Math.sin(a);
      var px=cx+rx*c,py=cy+ry*s,nx=c/rx,ny=s/ry,nl=Math.hypot(nx,ny);nx/=nl;ny/=nl;
      var L=10+Math.pow(Math.random(),1.6)*40+(Math.random()<.12?8:0);
      var w=.5+Math.random()*1.6,tx=-ny,ty=nx,bx=px-nx*8,by=py-ny*8;
      d+='M'+(bx+tx*w).toFixed(1)+' '+(by+ty*w).toFixed(1)+'L'+(px+nx*L).toFixed(1)+' '+(py+ny*L).toFixed(1)+'L'+(bx-tx*w).toFixed(1)+' '+(by-ty*w).toFixed(1)+'Z';
    }
    h+='<path class="sp s'+g+'" filter="url(#bl)" d="'+d+'"/>';
  }
  svg.innerHTML=h;
  bubble.insertBefore(svg,bubble.firstChild);
})();
stage.appendChild(bubble);
var input=bubble.querySelector('input'),queue=[],busy=false;
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
function charge(){
  halo.animate([{opacity:0,transform:'translate(-50%,-50%) scale(.3)'},{opacity:1,transform:'translate(-50%,-50%) scale(1.2)',offset:.6},{opacity:0,transform:'translate(-50%,-50%) scale(1.7)'}],{duration:1300,easing:'ease-out'});
  hand.animate([{opacity:0},{opacity:.7,offset:.5},{opacity:0}],{duration:1500});
}
function release(text){
  var r=tip.getBoundingClientRect(),x=r.left,y=r.top;
  var dx=innerWidth/2-x,dy=innerHeight/2-y,T=2600;
  var el=document.createElement('div');el.className='orb';
  var d=Math.min(210,Math.max(100,70+text.length*4.5));el.style.width=el.style.height=d+'px';
  var gl=document.createElement('div');gl.className='gl';var s=document.createElement('span');s.textContent=text;
  el.appendChild(gl);el.appendChild(s);el.style.left=x+'px';el.style.top=y+'px';document.body.appendChild(el);
  function f(p,sc,o,off){return {transform:'translate('+dx*p+'px,'+dy*p+'px) translate(-50%,-50%) scale('+sc+')',opacity:o,offset:off}}
  var a=el.animate([f(0,.1,0,0),f(.15,.5,1,.1),f(.5,1.2,1,.4),f(.85,3.5,1,.7),f(1,14,1,1)],{duration:T,easing:'linear'});
  s.animate([{opacity:1},{opacity:1,offset:.6},{opacity:0}],{duration:T,fill:'forwards'});
  a.onfinish=function(){el.remove()};
}
async function run(){
  if(busy)return;busy=true;
  while(queue.length){
    var t=queue.shift();
    up.classList.add('on');input.blur();await wait(900);
    aim.classList.add('on');await wait(750);
    charge();await wait(650);
    release(t);await wait(1300);
    flood.className='on';await wait(1300);
    aim.classList.remove('on');up.classList.remove('on');await wait(3000);
    flood.className='on dark';await wait(1400);
    flood.className='dark';await wait(1400);
    flood.className='';
    input.focus({preventScroll:true});
  }
  busy=false;
}
input.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  var v=input.value.trim();if(!v)return;
  queue.push(v);input.value='';bubble.animate([{transform:'scale(1)'},{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:350});run();
});
})();
</script>
