<style>
:root{--bg:#0a0a0a;--ink:#f4f1e8;--muted:#9a9a9a;--gold:#ffd98a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
header{text-align:center;padding:36px 20px 8px}
.back{display:inline-block;color:var(--gold);text-decoration:none;font-size:14px;margin-bottom:18px}
h1{margin:0;font-family:"Archivo Black",Impact,sans-serif;font-weight:400;font-size:clamp(28px,6vw,56px);text-transform:uppercase;line-height:1.05}
header p{max-width:560px;margin:14px auto 0;color:var(--muted);font-size:clamp(13px,2vw,15px)}
main{max-width:1100px;margin:0 auto;padding:28px 16px 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.card{background:#141414;border:1px solid #262626;border-radius:14px;overflow:hidden;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 30px rgba(255,200,80,.18)}
.thumb{position:relative;display:block;width:100%;aspect-ratio:4/5;padding:0;border:0;background:#111;cursor:zoom-in;overflow:hidden}
.thumb img,.ph{width:100%;height:100%;object-fit:cover;display:block}
.ph{display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.55);font-size:13px}
.sold{position:absolute;top:10px;left:10px;padding:3px 10px;border-radius:999px;background:#000b;color:#fff;font-size:12px;font-weight:500}
.meta{padding:12px 14px 14px}
.meta h3{margin:0;font-size:16px;font-weight:500}
.meta p{margin:2px 0 10px;color:var(--muted);font-size:13px}
button{font-family:inherit}
.buy,.wa{width:100%;padding:10px 16px;border:0;border-radius:999px;background:var(--gold);color:#3a2a08;font-size:15px;font-weight:500;cursor:pointer}
.buy:disabled,.wa:disabled{background:#333;color:#888;cursor:not-allowed}
.note{text-align:center;color:var(--muted);font-size:12px;padding:8px 16px 36px}
#lb{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.92)}
#lb[hidden]{display:none}
.box{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;width:min(1100px,100%);max-height:100%;background:#121212;border:1px solid #2a2a2a;border-radius:16px;padding:16px;overflow:auto}
.pic{max-height:82vh;overflow:auto;border-radius:10px;background:#0a0a0a;display:flex;align-items:center;justify-content:center;cursor:zoom-in}
.pic img{max-width:100%;max-height:82vh;display:block}
.pic.z{cursor:zoom-out;display:block}
.pic.z img{max-width:none;max-height:none;width:180%}
.pic .ph{min-height:50vh;width:100%}
.info h2{margin:0;font-family:"Archivo Black",Impact,sans-serif;font-weight:400;font-size:clamp(22px,3.4vw,32px);line-height:1.1}
.sub{margin:6px 0 12px;color:var(--muted);font-size:13px}
.info p{margin:0 0 14px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:8px 12px;border-radius:10px;border:1px solid #444;background:transparent;color:var(--ink);font-size:13px;cursor:pointer;text-align:left}
.chip[aria-pressed=true]{border-color:var(--gold);background:rgba(255,217,138,.14);color:var(--gold)}
.price{font-family:"Archivo Black",Impact,sans-serif;font-size:26px;margin:0 0 12px}
.x,.nv{position:fixed;z-index:60;width:42px;height:42px;border-radius:50%;border:1px solid #444;background:#000a;color:#fff;font-size:24px;line-height:1;cursor:pointer}
.x{top:max(12px,env(safe-area-inset-top,0px));right:12px}
.nv{top:50%;margin-top:-21px}.nv.p{left:8px}.nv.n{right:8px}
@media(max-width:760px){.box{grid-template-columns:1fr}.pic,.pic img{max-height:56vh}.nv{top:28vh}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
header h2{margin:8px 0 0;font-family:"Archivo Black",Impact,sans-serif;font-weight:400;font-size:clamp(16px,3.2vw,24px);letter-spacing:.04em;color:var(--gold)}
.top{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 auto 24px;max-width:520px}
.top a{padding:8px 14px;border-radius:999px;border:1px solid rgba(255,210,90,.55);background:rgba(255,210,90,.1);color:#ffe9a8;text-decoration:none;font-weight:500;font-size:13px;white-space:nowrap;box-shadow:0 0 12px rgba(255,200,60,.15);transition:background .2s,color .2s,box-shadow .2s}
.top a:hover,.top a:focus-visible,.top a[aria-current=page]{background:#ffd98a;color:#3a2a08;box-shadow:0 0 18px rgba(255,200,60,.5);outline:none}
@media(max-width:600px){main{padding:20px 12px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.meta{padding:10px 10px 12px}.meta h3{font-size:14px;line-height:1.3}.meta p{font-size:12px;margin-bottom:8px}.buy{padding:8px 10px;font-size:14px}.sold{top:6px;left:6px;font-size:11px}}
.note{padding-bottom:84px}
.cartbtn{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:999px;border:1px solid rgba(255,210,90,.6);background:rgba(20,16,8,.92);color:#ffe9a8;font-size:15px;font-weight:500;cursor:pointer;box-shadow:0 0 20px rgba(255,200,60,.3)}
.cartbtn b{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--gold);color:#3a2a08;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.cd{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.7);display:flex;justify-content:flex-end}
.cd[hidden]{display:none}
.cp{width:min(420px,100%);height:100%;background:#121212;border-left:1px solid #2a2a2a;display:flex;flex-direction:column}
.ch{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid #262626}
.ch h2{margin:0;font-family:"Archivo Black",Impact,sans-serif;font-weight:400;font-size:22px}
.ch button{width:38px;height:38px;border-radius:50%;border:1px solid #444;background:transparent;color:#fff;font-size:22px;cursor:pointer}
.cl{list-style:none;margin:0;padding:8px 16px;overflow:auto;flex:1}
.cl .empty{color:var(--muted);text-align:center;padding:40px 8px;font-size:14px}
.ci{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #222}
.cth{width:64px;height:80px;flex:none;border-radius:8px;overflow:hidden;background:#111}
.cth img,.cth .ph{width:100%;height:100%;object-fit:cover}.cth .ph span{display:none}
.cm{flex:1;min-width:0}.cm b{display:block;font-weight:500;font-size:14px}
.cm select{width:100%;margin:6px 0;padding:6px;border-radius:8px;border:1px solid #444;background:#1a1a1a;color:var(--ink);font:inherit;font-size:12px}
.cq{display:flex;align-items:center;gap:8px}
.cq button{width:28px;height:28px;border-radius:50%;border:1px solid #444;background:transparent;color:var(--ink);cursor:pointer;font-size:16px;line-height:1}
.cq .lp{margin-left:auto;font-size:13px;font-weight:500}
.cq .rm{border:0;color:var(--muted)}
.cf{padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid #262626}
.ct{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font-size:14px}
.ct b{font-family:"Archivo Black",Impact,sans-serif;font-weight:400;font-size:20px}
.lnk{display:block;margin:10px auto 0;background:none;border:0;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline}
.wa.ghost{margin-top:8px;background:transparent;border:1px solid rgba(255,210,90,.6);color:#ffe9a8}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(76px,calc(70px + env(safe-area-inset-bottom,0px)));z-index:90;display:flex;gap:12px;align-items:center;padding:10px 16px;border-radius:999px;background:#ffd98a;color:#3a2a08;font-size:14px;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,.5);white-space:nowrap;max-width:92vw}
.toast[hidden]{display:none}
.toast .tt{overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.toast button{border:0;background:none;color:#3a2a08;text-decoration:underline;font:inherit;cursor:pointer;padding:0}
.flt{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 auto 22px}
.flt button{padding:8px 16px;border-radius:999px;border:1px solid rgba(255,210,90,.55);background:rgba(255,210,90,.1);color:#ffe9a8;font-size:14px;font-weight:500;cursor:pointer;transition:background .2s,color .2s}
.flt button[aria-pressed=true]{background:var(--gold);color:#3a2a08}
.msg0{grid-column:1/-1;text-align:center;color:var(--muted);font-size:14px;padding:30px 0}
.meta .by{margin:3px 0 0;color:#cfcab8;font-size:13px}
.meta .pr{margin:4px 0 10px}
.cnt{position:absolute;right:8px;bottom:8px;padding:2px 9px;border-radius:999px;background:#000b;color:#fff;font-size:11px;font-weight:500}
.cartbtn b[hidden]{display:none}
.left{min-width:0}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.thumbs:empty{display:none}
.thumbs button{flex:none;width:64px;height:80px;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:#111;cursor:pointer}
.thumbs button[aria-current=true]{border-color:var(--gold)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.box.hasth .pic,.box.hasth .pic img{max-height:68vh}
@media(max-width:760px){.box.hasth .pic,.box.hasth .pic img{max-height:46vh}}
</style>
</head>
<body>
<header>
<nav class="top" aria-label="Halaman"><a href="index.html">Home</a><a href="index.html#portofolio">Portofolio</a><a href="galeri.html" aria-current="page">Beli Artwork</a><a href="jurnal.html">Jurnal Receh</a></nav>
<h1>ARTWORK</h1>
<h2>BANG UCOK &amp; ANAKNYA</h2>
<p>Pre Order Artprint 3-5 Hari Kerja</p>
<p>Harga belum termasuk ongkos kirim. Pembayaran dan pengiriman diatur lewat WhatsApp.</p>
</header>
<main><div class="flt" id="flt" role="group" aria-label="Filter artist"></div><div class="grid" id="grid"></div></main>
<footer class="note">@sayabangucok - 2026.</footer>

<div id="lb" role="dialog" aria-modal="true" aria-label="Detail karya" hidden>
<button class="x" id="lbx" aria-label="Tutup">×</button>
<button class="nv p" id="lbp" aria-label="Karya sebelumnya">‹</button>
<button class="nv n" id="lbn" aria-label="Karya berikutnya">›</button>
<div class="box"><div class="left"><div class="pic" id="lbpic" title="Klik untuk memperbesar"></div><div class="thumbs" id="lbth"></div></div><div class="info" id="lbinfo"></div></div>
</div>

<button id="cartbtn" class="cartbtn" aria-label="Buka keranjang">🛒 Keranjang <b id="cartn" hidden>0</b></button>
<div id="cartd" class="cd" role="dialog" aria-modal="true" aria-label="Keranjang" hidden>
<div class="cp">
<div class="ch"><h2>Keranjang</h2><button id="cartx" aria-label="Tutup keranjang">×</button></div>
<ul id="cartl" class="cl"></ul>
<div class="cf"><div class="ct"><span>Total (belum termasuk ongkir)</span><b id="cartt">Rp 0</b></div><button class="wa" id="cartwa">Pesan via WhatsApp</button><button class="lnk" id="cartclr">Kosongkan keranjang</button></div>
</div>
</div>
<div id="toast" class="toast" role="status" hidden><span class="tt"></span><button type="button">Lihat</button></div>
<script>
/* ====== EDIT BAGIAN INI ====== */
// Nomor WhatsApp: kode negara tanpa tanda +, contoh 6281295757246
var WA_NUMBER='6281295757246';
// Pilihan ukuran dan harga bawaan (bisa diganti per karya dengan menambah sizes:[...])
var SIZES=[
  {label:'Paper only (29,7 × 42 cm)',price:50000},
  {label:'Standard + Frame (29,7 × 42 cm)',price:150000},
  {label:'Jumbo + Frame (40 × 60 cm)',price:250000},
];
// Daftar karya. img: alamat file gambar, misalnya 'images/karya-1.jpg'.
// id hanya huruf kecil, angka, dan tanda hubung.
var ART=[
  {img:'images/nyam.jpg',photos:['images/nyam-2.jpg','images/nyam-3.jpg'],title:'NYAM!!!',year:2026,medium:'Anti UV Printing, Linen 230 gsm',desc:'Artist: Tuah (8YO).',bg:'linear-gradient(135deg,#1b1538,#ffd98a)'},
  {img:'images/mikeyme.jpg',title:'Mikey Me',year:2026,medium:'Anti UV Printing, Linen 230 gsm',desc:'Artist: Bang Ucok.',bg:'linear-gradient(160deg,#0b1026,#5b3a52 60%,#f2c9a0)'},
  {img:'images/naruto.jpg',title:'Naruto',year:2025,medium:'Anti UV Printing, Linen 230 gsm',desc:'Artist: Bang Ucok.',bg:'linear-gradient(200deg,#111,#3e5a8a)'},
  {img:'images/terjebakalien.jpg',title:'Terjebak Alien',year:2025,medium:'Anti UV Printing, Linen 230 gsm',desc:'Artist: Tuah (5YO).',bg:'linear-gradient(120deg,#2b1d1a,#ff9bd2)'},
  {img:'images/fishface.jpg',title:'Fish Face',year:2024,medium:'Anti UV Printing, Linen 230 gsm',desc:'Artist: Bang Ucok.',bg:'linear-gradient(170deg,#0a0a0a,#f5b400)'},
  {img:'images/smileplankton.jpg',photos:['images/smileplankton-2.jpg','images/smileplankton-3.jpg'],title:'Smile Plankton',year:2024,medium:'Anti UV Printing, Linen 230 gsm',desc:'Artist: Tuah (8YO).',bg:'linear-gradient(145deg,#1b1538,#3e5a8a 55%,#fffaf0)'},
  {img:'images/eyespiration.jpg',title:'Eyespiration',year:2024,medium:'Anti UV Printing, Linen 230 gsm',desc:'Artist: Bang Ucok.',bg:'linear-gradient(145deg,#1b1538,#3e5a8a 55%,#fffaf0)'}
];
/* ====== SELESAI ====== */

// Otomatis membuat id dari judul jika belum diisi (dipakai untuk alamat tiap karya)
(function(){var used={};ART.forEach(function(a){var b=a.id||String(a.title||'karya').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'karya',id=b,n=2;while(used[id])id=b+'-'+n++;used[id]=1;a.id=id})})();

(function(){
var $=function(s){return document.querySelector(s)};
var grid=$('#grid'),lb=$('#lb'),lbpic=$('#lbpic'),lbinfo=$('#lbinfo'),cur=-1,sel=0,last=null;
function rp(n){return 'Rp '+n.toLocaleString('id-ID')}
function sz(a){return a.sizes||SIZES}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pic(a){return a.img?'<img src="'+esc(a.img)+'" alt="'+esc(a.title)+'" loading="lazy">':'<div class="ph" style="background:'+a.bg+'"><span>Foto karya</span></div>'}
function wa(a,s){
  var t='Halo, saya tertarik membeli artprint "'+a.title+'"'+(s?' ukuran '+s.label+' ('+rp(s.price)+')':'')+'. Apakah masih tersedia?';
  window.open('https://wa.me/'+WA_NUMBER+'?text='+encodeURIComponent(t),'_blank','noopener');
}
var FILT=[['all','All'],['Bang Ucok','Bang Ucok'],['Hang Tuah','Hang Tuah']],fil='all',vis=[];
function who(a){var d=a.desc||'';return a.by||(/tuah/i.test(d)?'Hang Tuah':/ucok/i.test(d)?'Bang Ucok':'')}
function renderGrid(){
  vis=[];
  grid.innerHTML=ART.map(function(a,i){
    if(fil!=='all'&&who(a)!==fil)return '';
    vis.push(i);
    var lo=Math.min.apply(null,sz(a).map(function(s){return s.price})),np=(a.photos||[]).length;
    return '<article class="card"><button class="thumb" data-i="'+i+'" aria-label="Lihat detail '+esc(a.title)+'">'+pic(a)+(a.sold?'<b class="sold">Terjual</b>':'')+(np?'<b class="cnt">+'+np+' foto</b>':'')+'</button><div class="meta"><h3>'+esc(a.title)+'</h3>'+(a.desc?'<p class="by">'+esc(a.desc)+'</p>':'')+'<p class="pr">mulai '+rp(lo)+'</p><button class="buy" data-b="'+i+'"'+(a.sold?' disabled':'')+'>'+(a.sold?'Terjual':'+ Keranjang')+'</button></div></article>';
  }).join('');
  if(!vis.length)grid.innerHTML='<p class="msg0">Belum ada karya di kategori ini.</p>';
}
var flt=$('#flt');
flt.innerHTML=FILT.map(function(f){return '<button data-f="'+esc(f[0])+'" aria-pressed="'+(f[0]===fil)+'">'+esc(f[1])+'</button>'}).join('');
flt.addEventListener('click',function(e){var b=e.target.closest('[data-f]');if(!b)return;fil=b.dataset.f;[].forEach.call(flt.children,function(x){x.setAttribute('aria-pressed',x===b)});renderGrid()});
renderGrid();
grid.addEventListener('click',function(e){
  var t=e.target.closest('[data-i]');if(t){last=t;openLB(+t.dataset.i);return}
  var b=e.target.closest('[data-b]');if(b&&!b.disabled)addCart(+b.dataset.b,0);
});
function info(){
  var a=ART[cur],S=sz(a),s=S[sel];
  lbinfo.innerHTML='<h2>'+esc(a.title)+'</h2><div class="sub">'+esc(a.year)+' · '+esc(a.medium)+'</div><p>'+esc(a.desc)+'</p><div class="chips" role="group" aria-label="Pilih ukuran">'+S.map(function(x,i){return '<button class="chip" data-s="'+i+'" aria-pressed="'+(i===sel)+'">'+esc(x.label)+'</button>'}).join('')+'</div><div class="price">'+rp(s.price)+'</div><button class="wa" id="lbadd"'+(a.sold?' disabled':'')+'>'+(a.sold?'Terjual':'+ Keranjang')+'</button>'+(a.sold?'':'<button class="wa ghost" id="lbwa">Beli langsung via WhatsApp</button>');
}
var ph=0;
function photos(a){return a.img?[a.img].concat(a.photos||[]):[]}
function showPhoto(){
  var a=ART[cur],P=photos(a),th=$('#lbth');
  lbpic.classList.remove('z');
  lbpic.innerHTML=P.length?'<img src="'+esc(P[ph])+'" alt="'+esc(a.title)+(ph?' foto '+ph:'')+'">':pic(a);
  th.innerHTML=P.length>1?P.map(function(src,k){return '<button data-p="'+k+'" aria-label="'+(k?'Foto '+k:'Gambar karya')+'" aria-current="'+(k===ph)+'"><img src="'+esc(src)+'" alt=""></button>'}).join(''):'';
  lb.querySelector('.box').classList.toggle('hasth',P.length>1);
}
$('#lbth').addEventListener('click',function(e){var b=e.target.closest('[data-p]');if(!b)return;ph=+b.dataset.p;showPhoto()});
function nav(d){if(!vis.length)return;var p=vis.indexOf(cur);if(p<0)p=0;openLB(vis[(p+d+vis.length)%vis.length])}
function openLB(i){
  cur=(i+ART.length)%ART.length;sel=0;
  ph=0;showPhoto();info();
  lb.hidden=false;document.body.style.overflow='hidden';$('#lbx').focus();
  try{if(location.hash!=='#'+ART[cur].id)location.hash=ART[cur].id}catch(e){}
}
function closeLB(){
  if(lb.hidden)return;lb.hidden=true;document.body.style.overflow='';cur=-1;
  try{if(location.hash)history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  if(last)last.focus();
}
lbinfo.addEventListener('click',function(e){
  var c=e.target.closest('[data-s]');if(c){sel=+c.dataset.s;info();return}
  if(e.target.closest('#lbadd')){addCart(cur,sel);return}
  if(e.target.closest('#lbwa')){var a=ART[cur];if(!a.sold)wa(a,sz(a)[sel])}
});
lbpic.addEventListener('click',function(){if(lbpic.querySelector('img'))lbpic.classList.toggle('z')});
$('#lbx').onclick=closeLB;
$('#lbp').onclick=function(){nav(-1)};
$('#lbn').onclick=function(){nav(1)};
lb.addEventListener('click',function(e){if(e.target===lb)closeLB()});
document.addEventListener('keydown',function(e){
  if(lb.hidden)return;
  if(e.key==='Escape')closeLB();else if(e.key==='ArrowLeft')nav(-1);else if(e.key==='ArrowRight')nav(1);
});
function fromHash(){
  var id=location.hash.slice(1),i=ART.findIndex(function(a){return a.id===id});
  if(i>=0){if(vis.indexOf(i)<0){fil='all';[].forEach.call(flt.children,function(x){x.setAttribute('aria-pressed',x.dataset.f==='all')});renderGrid()}if(i!==cur)openLB(i)}else if(!lb.hidden){lb.hidden=true;document.body.style.overflow='';cur=-1}
}
var CK='galeri:cart',cart=[],tm=0;
var cartd=$('#cartd'),cartl=$('#cartl'),cartn=$('#cartn'),toastEl=$('#toast');
function find(id){return ART.filter(function(a){return a.id===id})[0]}
function sizeOf(c){var S=sz(find(c.id));return S.filter(function(x){return x.label===c.size})[0]||S[0]}
try{cart=JSON.parse(localStorage.getItem(CK)||'[]').filter(function(c){var a=find(c.id);return a&&!a.sold&&c.q>0})}catch(e){cart=[]}
function save(){try{localStorage.setItem(CK,JSON.stringify(cart))}catch(e){}}
function total(){return cart.reduce(function(n,c){return n+sizeOf(c).price*c.q},0)}
function paint(){
  var n=cart.reduce(function(s,c){return s+c.q},0);
  cartn.textContent=n;cartn.hidden=!n;
  if(cartd.hidden)return;
  cartl.innerHTML=cart.length?cart.map(function(c,k){
    var a=find(c.id),S=sz(a),s=sizeOf(c);
    return '<li class="ci"><div class="cth">'+pic(a)+'</div><div class="cm"><b>'+esc(a.title)+'</b><select data-k="'+k+'" aria-label="Ukuran '+esc(a.title)+'">'+S.map(function(x){return '<option'+(x.label===s.label?' selected':'')+'>'+esc(x.label)+'</option>'}).join('')+'</select><div class="cq"><button data-d="'+k+'" aria-label="Kurangi">−</button><span>'+c.q+'</span><button data-u="'+k+'" aria-label="Tambah">+</button><span class="lp">'+rp(s.price*c.q)+'</span><button class="rm" data-r="'+k+'" aria-label="Hapus">×</button></div></div></li>';
  }).join(''):'<li class="empty">Keranjang masih kosong. Pilih karya lalu tekan + Keranjang.</li>';
  $('#cartt').textContent=rp(total());
  $('#cartwa').disabled=!cart.length;
}
function toast(msg){
  toastEl.querySelector('.tt').textContent=msg;toastEl.hidden=false;
  clearTimeout(tm);tm=setTimeout(function(){toastEl.hidden=true},2600);
}
function addCart(i,si){
  var a=ART[i];if(!a||a.sold)return;
  var lab=sz(a)[si||0].label,ex=cart.filter(function(c){return c.id===a.id&&c.size===lab})[0];
  if(ex)ex.q=Math.min(99,ex.q+1);else cart.push({id:a.id,size:lab,q:1});
  save();paint();toast('"'+a.title+'" masuk keranjang');
}
function openCart(){cartd.hidden=false;document.body.style.overflow='hidden';paint();$('#cartx').focus()}
function closeCart(){cartd.hidden=true;if(lb.hidden)document.body.style.overflow=''}
function waCart(){
  if(!cart.length)return;
  var lines=cart.map(function(c,n){var a=find(c.id),s=sizeOf(c);return (n+1)+'. "'+a.title+'" - '+s.label+' x'+c.q+' = '+rp(s.price*c.q)});
  var t='Halo, saya ingin memesan artprint:\n'+lines.join('\n')+'\nTotal: '+rp(total())+' (belum termasuk ongkir)\nMohon info ketersediaan dan total dengan ongkir. Terima kasih!';
  window.open('https://wa.me/'+WA_NUMBER+'?text='+encodeURIComponent(t),'_blank','noopener');
}
$('#cartbtn').onclick=openCart;
$('#cartx').onclick=closeCart;
cartd.addEventListener('click',function(e){if(e.target===cartd)closeCart()});
$('#cartwa').onclick=waCart;
$('#cartclr').onclick=function(){cart=[];save();paint()};
toastEl.querySelector('button').onclick=function(){toastEl.hidden=true;openCart()};
cartl.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var k;
  if(b.dataset.u!=null){k=+b.dataset.u;cart[k].q=Math.min(99,cart[k].q+1)}
  else if(b.dataset.d!=null){k=+b.dataset.d;cart[k].q-=1;if(cart[k].q<1)cart.splice(k,1)}
  else if(b.dataset.r!=null){cart.splice(+b.dataset.r,1)}
  else return;
  save();paint();
});
cartl.addEventListener('change',function(e){
  var s=e.target.closest('select');if(!s)return;
  var k=+s.dataset.k,c=cart[k];c.size=s.value;
  var j=-1;cart.forEach(function(x,n){if(n!==k&&x.id===c.id&&x.size===c.size)j=n});
  if(j>=0){cart[j].q=Math.min(99,cart[j].q+c.q);cart.splice(k,1)}
  save();paint();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!cartd.hidden){closeCart();e.stopImmediatePropagation()}},true);
paint();
addEventListener('hashchange',fromHash);fromHash();
})();
</script>
</body>
</html>
